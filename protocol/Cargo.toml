[package]
name = "pmman-protocol"
version = "0.0.1-alpha"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
prost = "0.13"
regex = "1"
