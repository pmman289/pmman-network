# Pmman Network route export policy for BIRD 2.
#
# ------------------------- deployment variables -------------------------
# Linux FIB table used by Pmman Network on this node.
define PMMAN_NETWORK_KERNEL_TABLE = 52001;

# Linux interface that carries the Pmman Network client address pool.
# The direct protocol imports its connected prefixes without depending on
# which Linux FIB table contains them.
define PMMAN_NETWORK_INTERFACE = "wgnetport";

# Kernel route scan interval, in seconds.
define PMMAN_NETWORK_SCAN_TIME = 10;

ipv4 table pmman_network_v4;
ipv6 table pmman_network_v6;

# The direct protocol can feed the existing master tables directly. The
# dedicated Linux-table kernel protocols use private BIRD tables because BIRD
# permits only one kernel syncer per master table; their routes are connected
# to master4/master6 by the two pipes below.

filter pmman_network_kernel_import_v4 {
    # Routes imported from a Linux kernel table appear as RTS_INHERIT in BIRD.
    if source = RTS_INHERIT then accept;
    reject;
}

filter pmman_network_kernel_import_v6 {
    if source = RTS_INHERIT then accept;
    reject;
}

filter pmman_network_direct_import_v4 {
    if source = RTS_DEVICE then accept;
    reject;
}

filter pmman_network_direct_import_v6 {
    if source = RTS_DEVICE then accept;
    reject;
}

protocol direct pmman_network_direct {
    interface PMMAN_NETWORK_INTERFACE;

    ipv4 {
        table master4;
        import filter pmman_network_direct_import_v4;
        export none;
    };

    ipv6 {
        table master6;
        import filter pmman_network_direct_import_v6;
        export none;
    };
}

protocol kernel pmman_network_kernel_v4 {
    kernel table PMMAN_NETWORK_KERNEL_TABLE;
    scan time PMMAN_NETWORK_SCAN_TIME;
    learn;

    ipv4 {
        table pmman_network_v4;
        import filter pmman_network_kernel_import_v4;
        export filter {
            reject;
        };
    };
}

protocol kernel pmman_network_kernel_v6 {
    kernel table PMMAN_NETWORK_KERNEL_TABLE;
    scan time PMMAN_NETWORK_SCAN_TIME;
    learn;

    ipv6 {
        table pmman_network_v6;
        import filter pmman_network_kernel_import_v6;
        export filter {
            reject;
        };
    };
}

protocol pipe pmman_network_pipe_v4 {
    table master4;
    peer table pmman_network_v4;

    import filter {
        if source = RTS_INHERIT then accept;
        reject;
    };
    export filter {
        reject;
    };
}

protocol pipe pmman_network_pipe_v6 {
    table master6;
    peer table pmman_network_v6;

    import filter {
        if source = RTS_INHERIT then accept;
        reject;
    };
    export filter {
        reject;
    };
}
